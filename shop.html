<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Party | Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="shell">
  <main class="game-page shop-page">
    <div class="topbar">
      <div class="brand">
        <span class="meta-label">Pixel Party</span>
        <strong>Shop</strong>
      </div>
      <div class="topbar-actions">
        <div class="score-pill shop-credit-pill">Credits: <span data-credit-count>0</span></div>
        <a class="button ghost" href="index.html">Main Menu</a>
      </div>
    </div>

    <section class="game-shell">
      <div class="shop-grid" id="shopGrid"></div>
      <div class="inventory-card">
        <div class="inventory-head">
          <span class="menu-tag">Inventory</span>
          <strong>Owned Items</strong>
        </div>
        <ul class="inventory-list" data-inventory-list></ul>
        <p class="inventory-empty" data-inventory-empty>Empty</p>
      </div>
    </section>
  </main>
  <script src="watermark.js" defer></script>
  <script src="party-common.js" defer></script>
  <script src="shop.js" defer></script>
</body>
</html>
